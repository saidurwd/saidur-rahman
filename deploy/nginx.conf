# Nginx site for saidur-rahman.com (Ubuntu 24.04's Nginx 1.24, PHP 8.4-FPM, Cloudflare in front, SSL mode "Full (strict)").
# On Nginx 1.25.1 or newer, replace `listen 443 ssl http2;` with `listen 443 ssl;` plus a separate `http2 on;` line.
#
# Install:  sudo cp deploy/nginx.conf /etc/nginx/sites-available/saidur-rahman.com
#           sudo ln -s /etc/nginx/sites-available/saidur-rahman.com /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#
# Needs, before it will start:
#   - a certificate: a Cloudflare Origin certificate saved to the two paths below (or Let's Encrypt paths instead)
#   - /etc/nginx/snippets/cloudflare-realip.conf, made by deploy/cloudflare-ips.sh
#
# Laravel adds the security headers (CSP, HSTS and the rest) to everything PHP serves. This file adds the few that
# matter for files Nginx serves itself (the build assets and uploads).

# Hide the Nginx version everywhere (put this once in nginx.conf's http block if you prefer).
server_tokens off;

# Plain http goes to https. Cloudflare normally does this already; this covers direct requests.
server {
    listen 80;
    listen [::]:80;
    server_name saidur-rahman.com www.saidur-rahman.com;

    location /.well-known/acme-challenge/ { root /var/www/saidur-rahman/public; }
    location / { return 301 https://saidur-rahman.com$request_uri; }
}

# www goes to the bare domain.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.saidur-rahman.com;

    ssl_certificate     /etc/ssl/cloudflare/saidur-rahman.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/saidur-rahman.com.key;

    return 301 https://saidur-rahman.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name saidur-rahman.com;

    root /var/www/saidur-rahman/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/ssl/cloudflare/saidur-rahman.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/saidur-rahman.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    # The CV upload is limited to 10 MB in the app; leave room for the form around it.
    client_max_body_size 12m;

    # Compression for text. (If you install the Brotli module, turn that on as well.)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/rss+xml application/json application/javascript image/svg+xml;

    # --- Optional: keep /admin to your own network. Uncomment and use your address, or use Cloudflare Access instead. ---
    # location ^~ /admin {
    #     allow 203.0.113.10;
    #     deny all;
    #     try_files $uri /index.php?$query_string;
    # }

    # Built CSS, JS and fonts have a new file name whenever they change, so they can be cached for a year.
    location ^~ /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Uploaded images: stable URLs, so a shorter cache.
    location ^~ /storage/ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /favicon.svg { add_header Cache-Control "public, max-age=2592000"; access_log off; }

    # Everything else is Laravel (pages, the sitemap fallback, robots.txt, downloads, the admin).
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Health check for uptime monitors; no logging noise.
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 30s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # No other PHP file is ever run directly.
    location ~ \.php$ { return 404; }

    # Never serve dotfiles (.env, .git), except the certificate challenge folder.
    location ~ /\.(?!well-known) { deny all; return 404; }

    access_log /var/log/nginx/saidur-rahman.access.log;
    error_log  /var/log/nginx/saidur-rahman.error.log warn;
}
