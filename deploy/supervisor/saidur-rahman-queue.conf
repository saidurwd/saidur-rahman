; Keeps the queue worker running: contact form emails, backup notifications, anything queued.
; Install:  sudo cp deploy/supervisor/saidur-rahman-queue.conf /etc/supervisor/conf.d/
;           sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl status
;
; `queue:restart` (run by deploy.sh) makes the worker finish its job and exit; Supervisor starts it again with the new code.

[program:saidur-rahman-queue]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/saidur-rahman/artisan queue:work --sleep=3 --tries=3 --backoff=30 --max-time=3600 --timeout=90
directory=/var/www/saidur-rahman
user=deploy
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/www/saidur-rahman/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
