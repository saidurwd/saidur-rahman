; Drop-in PHP settings for production.
; Install:  sudo cp deploy/php-fpm-saidur.ini /etc/php/8.4/fpm/conf.d/99-saidur.ini
;           sudo cp deploy/php-fpm-saidur.ini /etc/php/8.4/cli/conf.d/99-saidur.ini   (CLI too, for queue and artisan)
;           sudo systemctl reload php8.4-fpm

expose_php = Off
memory_limit = 256M
upload_max_filesize = 12M
post_max_size = 14M
max_execution_time = 30
date.timezone = UTC

; OPcache. Files are not re-checked on every request, which is faster; deploy.sh reloads PHP-FPM to pick up new code.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
